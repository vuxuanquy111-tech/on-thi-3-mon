<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><link rel="manifest" href="manifest.webmanifest"><title>Ôn thi 3 môn – V4</title><style>
:root{--accent:#334155;--accent2:#0f172a;--soft:#f1f5f9;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8fafc;color:var(--text)}button{font:inherit}.app{max-width:1050px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.content{padding:20px 16px 60px}.hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 10px 30px #00000012}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.88}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px #00000008}.card{padding:20px;text-align:left;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #00000010}.dot{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:white;font-size:23px;margin-bottom:14px}.card h3{margin:0 0 6px}.muted{color:var(--muted)}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.menu button,.primary,.secondary,.danger{border:0;border-radius:16px;padding:18px;text-align:left;cursor:pointer;font-weight:750}.menu button{background:white;border:1px solid var(--line);color:var(--text)}.menu button strong{display:block;font-size:17px}.menu button span{display:block;margin-top:5px;color:var(--muted);font-weight:500}.primary{background:var(--accent);color:white}.secondary{background:var(--soft);color:var(--text)}.danger{background:#fee2e2;color:#991b1b}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.bar .actions{display:flex;gap:8px}.tiny{padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:white;cursor:pointer}.qbox{padding:20px}.qnum{font-size:13px;color:var(--muted);font-weight:750}.qtext{font-size:20px;line-height:1.5;font-weight:750;margin:8px 0 18px}.opts{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:15px;border:1px solid var(--line);background:white;border-radius:14px;text-align:left;cursor:pointer}.opt:hover{border-color:var(--accent)}.opt.selected{border:2px solid var(--accent);background:var(--soft)}.letter{min-width:30px;height:30px;border-radius:9px;background:#e2e8f0;display:grid;place-items:center;font-weight:800}.opt.selected .letter{background:var(--accent);color:white}.nav{display:flex;gap:10px;margin-top:14px}.nav button{flex:1}.status{padding:13px 15px;border-radius:13px;background:var(--soft);margin:12px 0}.correct{background:#dcfce7!important;border-color:#86efac!important}.wrong{background:#fee2e2!important;border-color:#fca5a5!important}.ungraded{background:#fef3c7!important;border-color:#fcd34d!important}.timer{font-size:20px;font-weight:900}.palette{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding:12px;background:var(--soft);border-radius:14px}.pal{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:white;cursor:pointer;font-weight:800}.pal.current{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent)}.pal.answered{background:#dcfce7;border-color:#86efac}.pal.marked{background:#fef3c7;border-color:#f59e0b;box-shadow:inset 0 0 0 2px #f59e0b}.pal.answered.marked{background:#dbeafe;border-color:#60a5fa}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sticky-submit{position:sticky;bottom:10px;z-index:8;margin-top:12px}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;background:var(--soft);border-radius:14px}.stat b{display:block;font-size:24px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.review-list{display:grid;gap:8px;margin-bottom:14px}.review-item{padding:12px;border:1px solid var(--line);border-radius:12px;background:white;cursor:pointer}.review-item.active{border-color:var(--accent);background:var(--soft)}.note{font-size:13px;color:var(--muted);line-height:1.5}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}.menu{grid-template-columns:1fr}.result{grid-template-columns:repeat(2,1fr)}.qtext{font-size:18px}.content{padding:14px 12px 45px}.hero h1{font-size:25px}}
</style></head><body><div class="app"><div class="top"><div class="brand">📚 Ôn thi 3 môn <span class="muted">· V4</span></div></div><main class="content" id="app"></main></div><script src="app.js"></script><script>
const SUBJECTS={VKQ:{name:'VKQ',label:'VKQ',color:'#1d4ed8',dark:'#172554',icon:'🎯'},VMH:{name:'VMH',label:'VMH',color:'#047857',dark:'#064e3b',icon:'📘'},VCX:{name:'VCX',label:'VCX',color:'#c2410c',dark:'#7c2d12',icon:'🧭'}};
let subject=null,view='home',exam=null,review=null,study=null,timer=null;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
function theme(){let s=SUBJECTS[subject]||{color:'#334155',dark:'#0f172a'};document.documentElement.style.setProperty('--accent',s.color);document.documentElement.style.setProperty('--accent2',s.dark);document.querySelector('meta[name=theme-color]').setAttribute('content',s.dark)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function qLabel(q){return q.section?`Câu ${q.number} · Phần ${q.section}`:`Câu ${q.number}`}
function render(){theme();const el=document.getElementById('app');if(view==='home')return home(el);if(view==='menu')return menu(el);if(view==='study')return studyView(el);if(view==='exam')return examView(el);if(view==='result')return resultView(el);if(view==='review')return reviewView(el);if(view==='stats')return statsView(el)}
function home(el){el.innerHTML=`<section class="hero"><h1>ÔN THI 3 MÔN · V4</h1><p>Chọn môn để bắt đầu. Dữ liệu được lấy trực tiếp từ 3 bộ Word đã cung cấp.</p></section><div class="grid">${Object.entries(SUBJECTS).map(([k,s])=>{let n=BANKS[k].length;return `<button class="card" onclick="choose('${k}')"><div class="dot" style="background:${s.color}">${s.icon}</div><h3>${s.label}</h3><div class="muted">${n} câu trong ngân hàng</div></button>`}).join('')}</div>`}
function choose(k){subject=k;view='menu';render()}
function backSubjects(){subject=null;view='home';render()}
function menu(el){const s=SUBJECTS[subject],n=BANKS[subject].length;el.innerHTML=`<div class="bar"><div><h2 style="margin:0">${s.icon} ${s.label}</h2><div class="muted">Ngân hàng: ${n} câu</div></div><div class="actions"><button class="tiny" onclick="backSubjects()">🔄 Đổi môn</button></div></div><div class="menu"><button onclick="startStudy()"><strong>📖 Ôn tập</strong><span>Học lần lượt, xem đáp án và điều hướng từng câu.</span></button><button onclick="startExam()"><strong>📝 Thi thử</strong><span>40 câu ngẫu nhiên · 30 phút · tự nộp khi hết giờ.</span></button><button onclick="startReview()"><strong>❌ Ôn câu sai</strong><span>Xem lại toàn bộ câu sai đã lưu của riêng môn này.</span></button><button onclick="view='stats';render()"><strong>📊 Thống kê</strong><span>Lịch sử thi và tổng hợp kết quả.</span></button></div><div style="margin-top:16px" class="note">← Quay lại môn: dùng nút <b>Đổi môn</b> ở góc trên. Dữ liệu thi/câu sai được lưu trên thiết bị bằng LocalStorage.</div>`}
function startStudy(){study={list:BANKS[subject].slice(),i:0,chosen:{},checked:{},marked:{}};view='study';render()}
function studyPalette(){return `<div class="palette">${study.list.map((q,i)=>`<button class="pal ${study.chosen[q.id]!=null?'answered':''} ${study.marked[q.id]?'marked':''} ${i===study.i?'current':''}" onclick="studyJump(${i})" title="${study.marked[q.id]?'Đã đánh dấu xem lại':''}">${i+1}</button>`).join('')}</div><div class="note" style="margin-top:7px">🟢 Đã chọn · 🟡 Đánh dấu xem lại · Viền xanh: câu đang mở</div>`}
function studyView(el){const q=study.list[study.i],ch=study.chosen[q.id],checked=study.checked[q.id];el.innerHTML=`<div class="bar"><div class="actions"><button class="tiny" onclick="view='menu';render()">← Về bộ môn</button><button class="tiny" onclick="backSubjects()">🔄 Chọn môn khác</button></div><div>${study.i+1}/${study.list.length}</div></div><div class="panel qbox"><div class="qnum">${qLabel(q)}</div><div class="qtext">${esc(q.question)}</div><div class="opts">${q.options.map(o=>`<button class="opt ${ch===o.key?'selected':''} ${checked?(o.key===q.answer?'correct':(ch===o.key?'wrong':'')):''}" onclick="studyPick('${o.key}')"><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`).join('')}</div>${checked?`<div class="status ${q.answer?'':'ungraded'}">${q.answer?`Đáp án đúng: <b>${q.answer}</b>`:'⚠️ File không đánh dấu đáp án chuẩn cho câu này; app không tự suy đoán.'}</div>`:''}<div class="review-actions"><button class="tiny" onclick="studyMark()">${study.marked[q.id]?'⭐ Bỏ đánh dấu':'🔖 Đánh dấu xem lại'}</button></div>${studyPalette()}<div class="nav"><button class="secondary" onclick="studyNav(-1)">← Câu trước</button><button class="primary" onclick="studyNav(1)">Câu tiếp →</button></div></div>`}
function studyPick(k){const q=study.list[study.i];study.chosen[q.id]=k;study.checked[q.id]=true;render()}
function studyMark(){const q=study.list[study.i];study.marked[q.id]=!study.marked[q.id];render()}
function studyJump(i){study.i=i;render()}
function studyNav(d){study.i=Math.max(0,Math.min(study.list.length-1,study.i+d));render()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(){const pool=shuffle(BANKS[subject]);exam={mode:'exam',list:pool.slice(0,Math.min(40,pool.length)),i:0,answers:{},marked:{},started:Date.now(),end:Date.now()+30*60*1000,auto:false};view='exam';clearInterval(timer);timer=setInterval(tick,500);render()}
function startWrongRetest(){let wr=store.get('v4_wrong_'+subject,{}),ids=Object.keys(wr),map=new Map(BANKS[subject].map(q=>[String(q.id),q])),list=ids.map(id=>map.get(String(id))).filter(Boolean);if(!list.length){alert('Hiện chưa có câu sai để thi lại.');return}exam={mode:'wrong-retest',list:shuffle(list),i:0,answers:{},marked:{},started:Date.now(),end:Date.now()+5*60*1000,auto:false};view='exam';clearInterval(timer);timer=setInterval(tick,500);render()}
function tick(){if(!exam)return;let left=Math.max(0,exam.end-Date.now());let x=document.getElementById('timer');if(x){let sec=Math.ceil(left/1000);x.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}if(left<=0){clearInterval(timer);submitExam(true)}}
function examPalette(){return `<div class="palette">${exam.list.map((q,i)=>`<button class="pal ${exam.answers[q.id]!=null?'answered':''} ${exam.marked[q.id]?'marked':''} ${i===exam.i?'current':''}" onclick="jumpExam(${i})" title="${exam.marked[q.id]?'Đã đánh dấu xem lại':''}">${i+1}</button>`).join('')}</div><div class="note" style="margin-top:7px">🟢 Đã chọn · 🟡 Đánh dấu xem lại · Viền xanh: câu đang mở</div>`}
function examView(el){const q=exam.list[exam.i],ch=exam.answers[q.id],limit=exam.list.length;el.innerHTML=`<div class="bar"><div><b>${SUBJECTS[subject].label} · ${exam.mode==='wrong-retest'?'THI LẠI CÂU SAI':'THI THỬ'}</b><div class="muted">${exam.i+1}/${limit} · ${exam.mode==='wrong-retest'?'5 phút':'30 phút'}</div></div><div class="actions"><button class="tiny" onclick="exitExam()">← Về bộ môn</button><button class="tiny" onclick="exitToSubjects()">🔄 Chọn môn khác</button><div class="timer" id="timer">${exam.mode==='wrong-retest'?'05:00':'30:00'}</div></div></div><div class="panel qbox"><div class="qnum">${qLabel(q)}</div><div class="qtext">${esc(q.question)}</div><div class="opts">${q.options.map(o=>`<button class="opt ${ch===o.key?'selected':''}" onclick="examPick('${o.key}')"><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div class="review-actions"><button class="tiny" onclick="examMark()">${exam.marked[q.id]?'⭐ Bỏ đánh dấu':'🔖 Đánh dấu xem lại'}</button></div>${examPalette()}<div class="nav"><button class="secondary" onclick="examNav(-1)">← Câu trước</button><button class="primary" onclick="exam.i<${limit-1}?examNav(1):confirmSubmit()">${exam.i<limit-1?'Câu tiếp →':'Nộp bài'}</button></div><div class="sticky-submit"><button class="danger" style="width:100%;text-align:center;font-size:16px" onclick="confirmSubmit()">📝 Nộp bài</button></div><div class="note" style="margin-top:12px">Có thể nộp bài bất cứ lúc nào, kể cả khi còn câu chưa trả lời. Nếu file không có đáp án chuẩn, câu đó được ghi là “không chấm”.</div></div>`;tick()}
function examPick(k){exam.answers[exam.list[exam.i].id]=k;render()}
function examMark(){const q=exam.list[exam.i];exam.marked[q.id]=!exam.marked[q.id];render()}
function jumpExam(i){exam.i=i;render()}
function examNav(d){exam.i=Math.max(0,Math.min(exam.list.length-1,exam.i+d));render()}
function confirmSubmit(){let unanswered=exam.list.filter(q=>exam.answers[q.id]==null).length;if(unanswered>0){if(confirm(`Bạn còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài?`))submitExam(false)}else if(confirm('Bạn có chắc chắn muốn nộp bài?'))submitExam(false)}
function exitExam(){if(confirm('Bạn muốn thoát bài thi? Bài thi hiện tại sẽ không được chấm và không lưu kết quả.')){clearInterval(timer);exam=null;view='menu';render()}}
function exitToSubjects(){if(confirm('Bạn muốn thoát bài thi và chọn môn khác? Bài thi hiện tại sẽ không được chấm và không lưu kết quả.')){clearInterval(timer);exam=null;backSubjects()}}
function submitExam(auto){if(!exam)return;clearInterval(timer);let correct=0,wrong=0,unanswered=0,ungraded=0,wrongItems=[];exam.list.forEach(q=>{let a=exam.answers[q.id];if(!q.answer){if(a==null)unanswered++;else ungraded++;return}if(a==null)unanswered++;else if(a===q.answer)correct++;else{wrong++;wrongItems.push({id:q.id,selected:a,correct:q.answer})}});let total=exam.list.length;let graded=total-ungraded;let score=graded?correct/graded*10:0;let attempt={id:Date.now(),date:new Date().toLocaleString('vi-VN'),correct,wrong,unanswered,ungraded,score,percent:graded?correct/graded*100:0,total,graded,used:Math.round((Date.now()-exam.started)/1000),mode:exam.mode||'exam'};let hist=store.get('v4_hist_'+subject,[]);hist.unshift(attempt);store.set('v4_hist_'+subject,hist.slice(0,50));let wr=store.get('v4_wrong_'+subject,{});if(exam.mode==='wrong-retest'){wrongItems.forEach(x=>{wr[x.id]={selected:x.selected,correct:x.correct,date:Date.now()}});exam.list.forEach(q=>{let a=exam.answers[q.id];if(q.answer&&a===q.answer)delete wr[q.id]})}else{wrongItems.forEach(x=>{wr[x.id]={selected:x.selected,correct:x.correct,date:Date.now()}})}store.set('v4_wrong_'+subject,wr);exam.result=attempt;exam.wrongItems=wrongItems;view='result';render()}
function resultView(el){const r=exam.result;const isRetest=r.mode==='wrong-retest';el.innerHTML=`<div class="bar"><div class="actions"><button class="tiny" onclick="view='menu';render()">← Về bộ môn</button><button class="tiny" onclick="backSubjects()">🔄 Chọn môn khác</button></div></div><div class="hero"><h1>${isRetest?'KẾT QUẢ THI LẠI CÂU SAI':'KẾT QUẢ THI THỬ'}</h1><p>${r.date}</p></div><div class="result" style="margin-top:16px"><div class="stat"><span>Điểm</span><b>${r.score.toFixed(2)}/10</b></div><div class="stat"><span>Đúng</span><b>${r.correct}</b></div><div class="stat"><span>Sai</span><b>${r.wrong}</b></div><div class="stat"><span>Chưa trả lời</span><b>${r.unanswered}</b></div><div class="stat"><span>Không chấm</span><b>${r.ungraded}</b></div><div class="stat"><span>Tỷ lệ</span><b>${r.percent.toFixed(1)}%</b></div><div class="stat"><span>Thời gian</span><b>${Math.floor(r.used/60)}:${String(r.used%60).padStart(2,'0')}</b></div><div class="stat"><span>Tổng số</span><b>${r.total}</b></div></div><div class="menu"><button onclick="${isRetest?'startWrongRetest()':'startExam()'}"><strong>📝 ${isRetest?'Thi lại câu sai':'Thi thử lại'}</strong><span>${isRetest?'Thi lại toàn bộ câu sai hiện còn lưu trong 5 phút.':'40 câu ngẫu nhiên mới.'}</span></button><button onclick="startReview()"><strong>❌ Ôn câu sai</strong><span>Xem lại từng câu sai.</span></button></div>`}
function startReview(){let wr=store.get('v4_wrong_'+subject,{}),ids=Object.keys(wr);let map=new Map(BANKS[subject].map(q=>[q.id,q]));let list=ids.map(id=>({q:map.get(id),meta:wr[id]})).filter(x=>x.q);if(!list.length){review={list:[],i:0};view='review';render();return}review={list,i:0};view='review';render()}
function reviewView(el){
if(!review.list.length){el.innerHTML=`<div class="bar"><div class="actions"><button class="tiny" onclick="view='menu';render()">← Về bộ môn</button><button class="tiny" onclick="backSubjects()">🔄 Chọn môn khác</button></div></div><div class="empty panel"><h3>🎉 Chưa có câu sai</h3><p>Bạn chưa có câu sai được lưu ở môn ${SUBJECTS[subject].label}.</p></div>`;return}
const item=review.list[review.i],q=item.q,ch=item.meta.selected;
el.innerHTML=`<div class="bar"><div class="actions"><button class="tiny" onclick="view='menu';render()">← Về bộ môn</button><button class="tiny" onclick="backSubjects()">🔄 Chọn môn khác</button></div><b>❌ ÔN CÂU SAI · ${review.i+1}/${review.list.length}</b></div><div class="panel qbox"><div class="qnum">${qLabel(q)}</div><div class="qtext">${esc(q.question)}</div><div class="opts">${q.options.map(o=>`<div class="opt ${o.key===q.answer?'correct':(o.key===ch?'wrong':'')}"><span class="letter">${o.key}</span><span>${esc(o.text)} ${o.key===ch?' <b>← Bạn chọn</b>':''} ${o.key===q.answer?' <b>← Đáp án đúng</b>':''}</span></div>`).join('')}</div><div class="status">Bạn đã chọn: <b>${ch||'Chưa trả lời'}</b> · Đáp án đúng: <b>${q.answer||'Chưa được đánh dấu trong file nguồn'}</b></div><div class="nav"><button class="secondary" onclick="review.i=Math.max(0,review.i-1);render()" ${review.i===0?'disabled':''}>← Câu trước</button><button class="primary" onclick="review.i=Math.min(review.list.length-1,review.i+1);render()" ${review.i===review.list.length-1?'disabled':''}>Câu tiếp →</button></div><div class="review-actions"><button class="primary" onclick="startWrongRetest()">📝 Thi lại câu sai · 5 phút</button></div></div>`}

function statsView(el){let h=store.get('v4_hist_'+subject,[]);let total=h.length,avg=total?h.reduce((a,x)=>a+x.score,0)/total:0;el.innerHTML=`<div class="bar"><div class="actions"><button class="tiny" onclick="view='menu';render()">← Về bộ môn</button><button class="tiny" onclick="backSubjects()">🔄 Chọn môn khác</button></div><h2 style="margin:0">📊 Thống kê</h2></div><div class="result"><div class="stat"><span>Lần thi</span><b>${total}</b></div><div class="stat"><span>Điểm TB</span><b>${avg.toFixed(2)}</b></div><div class="stat"><span>Cao nhất</span><b>${total?Math.max(...h.map(x=>x.score)).toFixed(2):'0.00'}</b></div><div class="stat"><span>Câu sai đang lưu</span><b>${Object.keys(store.get('v4_wrong_'+subject,{})).length}</b></div></div><div class="panel" style="margin-top:16px;padding:12px;overflow:auto">${h.length?`<table class="table"><thead><tr><th>Thời gian</th><th>Điểm</th><th>Đúng</th><th>Sai</th><th>Chưa TL</th><th>Không chấm</th></tr></thead><tbody>${h.map(x=>`<tr><td>${x.date}</td><td><b>${x.score.toFixed(2)}</b></td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.unanswered}</td><td>${x.ungraded}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có lần thi nào.</div>'}</div>`}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
