*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--text);background:var(--bg)}

","text":"Hoạt động có mục đích của con người đỗ tạo ra của cải","correct":false},{"letter":"B","text":"Hoạt động lao động sản xuất của con người","correct":false},{"letter":"C","text":"Sức lao động là cái đảm bảo cho con người được trả công","correct":false},{"letter":"D","text":"Toàn bộ thể lực và trí lực trong một con người đang sống và được vận dụng để sản xuất ra giá trị sử dụng nào đó","correct":true}]},{"n":91,"text":"Trong quá trình sản xuất giá trị thặng dư, giá trị TLSX đã tiêu dùng số như thế nào?","options":[{"letter":"A","text":"Được bù đắp","correct":false},{"letter":"B","text":"Được lao động cụ thể của người sản xuất hàng hoá bảo tồn và chuyển vào giá trị của sản phẩm mới","correct":true},{"letter":"C","text":"Được tái sản xuất","correct":false},{"letter":"D","text":"Không được tái sản xuất","correct":false}]},{"n":92,"text":"Muốn tăng khối lượng giá trị thặng dư, nhà tư bản có thể sử dụng những cách nào dưới đây?","options":[{"letter":"A","text":"Giảm giá trị sức lao động khi ngày lao động không đổi","correct":false},{"letter":"B","text":"Kéo dài thời gian lao động trong ngày khi thời gian lao động cần thiết không đổi","correct":false},{"letter":"C","text":"Tăng cường độ lao động khi ngày lao động không đổi","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":true}]},{"n":93,"text":"Phương pháp sản xuất giá trị thặng dư tuyệt đối và phương pháp sản xuất giá trị thặng dư tương đối có điểm nào giống nhau? Chọn ý đúng:","options":[{"letter":"A","text":"Đều làm cho công nhân tốn sức lao động nhiều hơn","correct":false},{"letter":"B","text":"Đều làm giảm giá trị sức lao động của công nhân","correct":false},{"letter":"C","text":"Đều làm tăng tỷ suất giá trị thặng dư","correct":true},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":94,"text":"Khi xem xét phương pháp sản xuất giá trị thặng dư tuyệt đối, đáp án nào dưới đây không đúng?","options":[{"letter":"A","text":"Giá trị sức lao động không đổi.","correct":false},{"letter" ững doanh nghiệp nhỏ, dễ dàng thay đổi và thích nghi","correct":false}]},{"n":99,"text":"Giá trị thặng dư tương đối và giá trị thặng dư siêu ngạch giống nhau ở những điểm nào:","options":[{"letter":"A","text":"Đều do kéo dài ngày lao động","correct":false},{"letter":"B","text":"Đầu do sự tiến bộ khoa học kỹ thuật","correct":false},{"letter":"C","text":"Đều dựa trên tiền đề tăng NSLĐ","correct":true},{"letter":"D","text":"Điều tồn tại ở tất cả các doanh nghiệp","correct":false}]},{"n":100,"text":"Những nhận xét dưới đây về phương pháp sản xuất giá trị thặng dư tuyệt đối, nhận xét nào là không đúng","options":[{"letter":"A","text":"Chủ yếu áp dụng ở giai đoạn đầu của CNTB khi kỹ thuật còn thủ công lạc hậu","correct":false},{"letter":"B","text":"Giá trị sức lao động không thay đổi","correct":false},{"letter":"C","text":"Ngày lao động không thay đổi","correct":true},{"letter":"D","text":"Thời gian lao động thặng dư thay đổi","correct":false}]},{"n":101,"text":"Vai trò của máy móc trong quá trình tạo ra giá trị thặng dư, chọn ý đúng?","options":[{"letter":"A","text":"Máy móc là nguồn gốc của giá trị thặng dư","correct":false},{"letter":"B","text":"Máy móc là tiền đề vật chất cho việc tạo ra giá trị thặng dư","correct":true},{"letter":"C","text":"Máy móc là yếu tố quyết định để tạo ra giá trị thặng dư","correct":false},{"letter":"D","text":"Máy móc và sức lao động đều tạo ra giá trị thặng dư","correct":false}]},{"n":102,"text":"Sự phân chia tư bản thành tư bản bất biến và tư bản khả biến để chỉ rõ","options":[{"letter":"A","text":"Đặc điểm chuyển giá trị của từng loại tư bản vào sản phẩm","correct":false},{"letter":"B","text":"Nguồn gốc của giá trị thặng dư","correct":true},{"letter":"C","text":"Phương thức chu chuyển của tư bản vào giá trị sản phẩm mới","correct":false},{"letter":"D","text":"Vai trò của lao động quá khứ và lao động sống trong việc tạo ra giá trị sử dụng","correct":false}]},{"n":103,"text":"Cơ sở chung của giá trị thặng dư trong đối và giá trị thặng dư si  Tư sản Pháp năm 1789","correct":false},{"letter":"D","text":"Thắng lợi của Công xã Pari năm 1871","correct":false}]},{"n":23,"text":"Thời đại hiện nay là thời đại quá độ lên chủ nghĩa xã hội trên phạm vi toàn thế giới, được bắt đầu","options":[{"letter":"A","text":"Từ Cách mạng tháng Hai năm 1917","correct":false},{"letter":"B","text":"Từ Cách mạng tháng Mười Nga năm 1917","correct":true},{"letter":"C","text":"Từ khi bắt đầu thực hiện chính sách kinh tế mới (NEP) năm 1921","correct":false},{"letter":"D","text":"Tử sau khi Liên Xô kết thúc thời kỳ quá độ năm 1936","correct":false}]},{"n":24,"text":"Tính chất của thời đại hiện nay:","options":[{"letter":"A","text":"Diễn ra cuộc đấu tranh gay go, quyết liệt giữa CNXH và CNTB trên phạm vi toàn thế giới.","correct":false},{"letter":"B","text":"Giai cấp công nhân tiến hành đấu tranh giành chính quyền đi lên CNXH","correct":false},{"letter":"C","text":"Thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới.","correct":true},{"letter":"D","text":"Thời kỳ xây dựng những tiền để kinh tế, chính trị, văn hoá, xã hội cho CNXH","correct":false}]},{"n":25,"text":"Sự sụp đổ của chủ nghĩa xã hội hiện thực ở Liên Xô và Đông Âu có làm thay đổi nội dung, tính chất thời đại hiện nay:","options":[{"letter":"A","text":"Có thay đổi","correct":false},{"letter":"B","text":"Đang thay đổi","correct":false},{"letter":"C","text":"Không thay đổi","correct":true},{"letter":"D","text":"Tất cả các đáp án đều sai","correct":false}]},{"n":26,"text":"Đâu là xu thế chủ yếu trong giai đoạn hiện nay của thời đại:","options":[{"letter":"A","text":"Hòa bình, độc lập và tự chủ","correct":false},{"letter":"B","text":"Hòa bình, hợp tác và phát triển","correct":true},{"letter":"C","text":"Hợp tác, liên kết và cạnh tranh","correct":false},{"letter":"D","text":"Hợp tác, liên minh và phát triển triển","correct":false}]},{"n":27,"text":"Đâu là hình thái kinh tế - xã hội phát triển cao nhất hiện nay:","options":[{"letter":"A","text":"Hình thái kinh tế - cộng sản chủ nghĩa","correct":true},{"letter":"B","text":"Hình thái kinh tế - xã hội chiếm hữu nô lệ","correct":false},{"letter":"C","text":"Hình thái kinh tế - xã hội phong kiến","correct":false},{"letter":"D","text":"Hình thái kinh tế - xã hội tư bản chủ nghĩa","correct":false}]},{"n":28,"text":"Theo quan điểm của chủ nghĩa Mác - Lênin, sự ra đời của hình thái kinh tế - xã hội cộng sản chủ nghĩa phải thông qua cách mạng:","options":[{"letter":"A","text":"Cách mạng công nghiệp","correct":false},{"letter":"B","text":"Cách mạng khoa học và công nghệ","correct":false},{"letter":"C","text":"Cách mạng tư sản","correct":false},{"letter":"D","text":"Cách mạng xã hội chủ nghĩa","correct":true}]},{"n":29,"text":"Chủ nghĩa xã hội hiện thực ra đời sau thắng lợi của sự kiện:","options":[{"letter":"A","text":"Cách mạng Tân Hợi năm 1911","correct":false},{"letter":"B","text":"Cách mạng Tháng 8 năm 1945","correct":false},{"letter":"C","text":"Cách mạng Tháng Mười Nga năm 1917","correct":true},{"letter":"D","text":"Công xã Pari năm 1871","correct":false}]},{"n":30,"text":"Thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam bắt đầu trên phạm vi cả nước từ:","options":[{"letter":"A","text":"1945","correct":false},{"letter":"B","text":"1954","correct":false},{"letter":"C","text":"1975","correct":true},{"letter":"D","text":"1986","correct":false}]},{"n":31,"text":"Thực hiện nguyên tắc phân phối “làm theo năng lực, hưởng theo nhu cầu\" là đặc trưng của giai đoạn","options":[{"letter":"A","text":"Chủ nghĩa cộng sản","correct":true},{"letter":"B","text":"Chủ nghĩa tư bản","correct":false},{"letter":"C","text":"Chủ nghĩa xã hội","correct":false},{"letter":"D","text":"Thời kỳ quá độ lên chủ nghĩa xã hội","correct":false}]},{"n":32,"text":"Đặc trưng bao trùm, tổng quát nhất của xã hội xã hội chủ nghĩa ở Việt Nam được nêu trong Cương lĩnh (bổ sung, phát triển 2011)","options":[{"letter":"A","text":"Dân giàu, dân chủ, công bằng, nước mạnh, văn minh","correct":false},{"letter":"B","text":"Dân giàu, dân chủ, công bằng, nước mạnh, văn minh","correct":false},{"letter":"C","text":"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh","correct":true},{"letter":"D","text":"Dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh","correct":false}]},{"n":33,"text":"Định hướng xã hội chủ nghĩa ở Việt Nam nhằm mục tiêu:","options":[{"letter":"A","text":"Bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa","correct":false},{"letter":"B","text":"Độc lập dân tộc và chủ nghĩa xã hội","correct":true},{"letter":"C","text":"Rút ngắn thời kỳ quá độ đi lên chủ nghĩa xã hội ở Việt Nam","correct":false},{"letter":"D","text":"Thực hiện thắng lợi công cuộc đổi mới","correct":false}]},{"n":34,"text":"Quân đội nhân dân Việt Nam mang bản chất của giai cấp:","options":[{"letter":"A","text":"Đội ngũ trí thức","correct":false},{"letter":"B","text":"Giai cấp công nhân","correct":true},{"letter":"C","text":"Giai cấp nông dân","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":35,"text":"Định hướng xã hội chủ nghĩa ở Việt Nam là định hướng phát triển ở giai đoạn:","options":[{"letter":"A","text":"Chủ nghĩa cộng sản","correct":false},{"letter":"B","text":"Chủ nghĩa xã hội","correct":false},{"letter":"C","text":"Tất cả các đáp án đều sai","correct":false},{"letter":"D","text":"Thời kỳ quá độ lên chủ nghĩa xã hội","correct":true}]},{"n":36,"text":"Chủ thể định hướng xã hội chủ nghĩa ở Việt Nam:","options":[{"letter":"A","text":"Do Đảng Cộng sản lãnh đạo.","correct":false},{"letter":"B","text":"Toàn bộ hệ thống chính trị và nhân dân do Đảng Cộng sản lãnh đạo","correct":true},{"letter":"C","text":"Toàn bộ hệ thống chính trị xã hội chủ nghĩa ở Việt Nam.","correct":false},{"letter":"D","text":"Toàn thể nhân dân","correct":false}]},{"n":37,"text":"Chọn phương án đúng nói về hình thức dân chủ gián tiếp còn được gọi là dân chủ:","options":[{"letter":"A","text":"Bao quát","correct":false},{"letter":"B","text":"Biểu quyết","correct":false},{"letter":"C","text":"Đại diện","correct":true},{"letter":"D","text":"Đại khái","correct":false}]},{"n":38,"text":"Nền dân chủ phát triển cao nhất trong lịch sử nhân loại:","options":[{"letter":"A","text":"Nền dân chủ chủ nô","correct":false},{"letter":"B","text":"Nền dân chủ tư sản","correct":false},{"letter":"C","text":"Nền dân chủ xã hội chủ nghĩa","correct":true},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":39,"text":"Bản chất của một nền dân chủ do ai quy định:","options":[{"letter":"A","text":"Chế độ nhà nước quy định","correct":false},{"letter":"B","text":"Chế độ sở hữu về tư liệu sản xuất quy định","correct":false},{"letter":"C","text":"Giai cấp thống trị quy định","correct":true},{"letter":"D","text":"Quần chúng đấu tranh đòi dân chủ quy định","correct":false}]},{"n":40,"text":"Chọn phương án đúng nhất nói về nền dân chủ xã hội chủ nghĩa là của chủ thể:","options":[{"letter":"A","text":"Giai cấp công nhân","correct":false},{"letter":"B","text":"Giai cấp công nhân và đội ngũ trí thức","correct":false},{"letter":"C","text":"Giai cấp công nhân và giai cấp nông dân","correct":false},{"letter":"D","text":"Giai cấp công nhân và quần chúng nhân dân lao động","correct":true}]},{"n":41,"text":"Hệ thống chính trị xã hội chủ nghĩa ở Việt Nam vận hành theo cơ chế:","options":[{"letter":"A","text":"Đảng lãnh đạo, Nhà nước điều hành, Nhân dân thực hiện","correct":false},{"letter":"B","text":"Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ","correct":true},{"letter":"C","text":"Đảng lãnh đạo, Nhà nước thu thuế, Nhân dân lao động","correct":false},{"letter":"D","text":"Đảng lãnh đạo, Nhà nước thực thi, Nhân dân làm việc","correct":false}]},{"n":42,"text":"Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, giai cấp nào là lực lượng đi đầu trong phát triển kinh tế, đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước?","options":[{"letter":"A","text":"Đội ngũ doanh nhân","correct":false},{"letter":"B","text":"Đội ngũ trí thức","correct":false},{"letter":"C","text":"Giai cấp công nhân","correct":true},{"letter":"D","text":"Giai cấp nông dân","correct":false}]},{"n":43,"text":"Ai là tác giả luận điểm: “Vô sản tất cả các nước đoàn kết lại”?","options":[{"letter":"A","text":"C. Mác","correct":true},{"letter":"B","text":"Hồ Chí Minh","correct":false},{"letter":"C","text":"Ph. Ăngghen","correct":false},{"letter":"D","text":"V. Lênin","correct":false}]},{"n":44,"text":"Ai là tác giả luận điểm: “Vô sản tất cả các nước và các dân tộc bị áp bức toàn thế giới liên hiệp lại”?","options":[{"letter":"A","text":"C. Mác","correct":false},{"letter":"B","text":"Hồ Chí Minh","correct":false},{"letter":"C","text":"Ph. Ăngghen","correct":false},{"letter":"D","text":"V. I. Lênin","correct":true}]},{"n":45,"text":"Ai là tác giả luận điểm: “Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công”","options":[{"letter":"A","text":"C. Mác","correct":false},{"letter":"B","text":"Hồ Chí Minh","correct":true},{"letter":"C","text":"Ph. Ăngghen","correct":false},{"letter":"D","text":"V. I. Lênin","correct":false}]},{"n":46,"text":"Mục tiêu của thời đại hiện nay, chọn phương án đúng nhất?","options":[{"letter":"A","text":"Hoà bình, độc lập dân tộc và chủ nghĩa xã hội","correct":false},{"letter":"B","text":"Hoà bình, độc lập dân tộc và dân chủ","correct":false},{"letter":"C","text":"Hoà bình, độc lập dân tộc và tiến bộ xã hội","correct":false},{"letter":"D","text":"Hoà bình, độc lập dân tộc, dân chủ và tiến bộ xã hội","correct":true}]},{"n":47,"text":"Đâu là mục tiêu chung của toàn thể nhân loại tiến bộ hiện nay?","options":[{"letter":"A","text":"Dân chủ","correct":false},{"letter":"B","text":"Độc lập dân tộc","correct":false},{"letter":"C","text":"Hoà bình","correct":true},{"letter":"D","text":"Tiến bộ xã hội","correct":false}]},{"n":48,"text":"Giai đoạn hiện nay của thời đại được bắt đầu:","options":[{"letter":"A","text":"Từ cuộc Cách mạng tháng Mười Nga năm 1917 đến kết thúc chiến tranh thế giới lần thứ 2 năm 1945","correct":false},{"letter":"B","text":"Từ cuối những năm 1970 đến cuối những năm 1980","correct":false},{"letter":"C","text":"Từ đầu những năm 90 thế kỷ XX đến nay","correct":true},{"letter":"D","text":"Từ sau năm 1945 đến đầu những năm 1970","correct":false}]},{"n":49,"text":"Điểm “đặc biệt\" của hệ thống chính trị xã hội chủ nghĩa ở Việt Nam các tổ chức chính trị - xã hội đều được thành lập bởi:","options":[{"letter":"A","text":"Đảng Cộng sản Việt Nam","correct":true},{"letter":"B","text":"Mặt trận Tổ quốc Việt Nam","correct":false},{"letter":"C","text":"Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","correct":false},{"letter":"D","text":"Tất cả các đáp án đều sai","correct":false}]},{"n":50,"text":"Theo quan điểm chủ nghĩa Mác – Lênin, dân tộc được hiểu theo nghĩa cơ bản:","options":[{"letter":"A","text":"Cộng đồng tộc người","correct":false},{"letter":"B","text":"Quốc gia dân tộc","correct":false},{"letter":"C","text":"Tộc người","correct":false},{"letter":"D","text":"Tộc người và quốc gia dân tộc","correct":true}]},{"n":51,"text":"Theo quan điểm chủ nghĩa Mác - Lênin, xu hướng khách quan của sự phát triển dân tộc:","options":[{"letter":"A","text":"Liên hiệp","correct":false},{"letter":"B","text":"Nguyên trạng","correct":false},{"letter":"C","text":"Phân tách","correct":false},{"letter":"D","text":"Phân tách và liên hiệp","correct":true}]},{"n":52,"text":"Nội dung Cương lĩnh dân tộc của chủ nghĩa Mác – Lênin gồm:","options":[{"letter":"A","text":"Quyền bình đẳng","correct":false},{"letter":"B","text":"Quyền liên hiệp công nhân các dân tộc","correct":false},{"letter":"C","text":"Quyền tự quyết","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":true}]},{"n":53,"text":"Nguồn gốc cơ bản dẫn đến sự ra đời tôn giáo gồm:","options":[{"letter":"A","text":"Kinh tế-xã hội","correct":false},{"letter":"B","text":"Nhận thức","correct":false},{"letter":"C","text":"Tâm lý","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":true}]},{"n":54,"text":"Điền từ còn thiếu vào chỗ trống để hoàn thành Quan điểm của Đảng Cộng sản Việt Nam chỉ rõ: “Nội dung [...] của công tác tôn giáo là công tác vận động quân chúng”.","options":[{"letter":"A","text":"Cơ bản","correct":false},{"letter":"B","text":"Cốt lõi","correct":true},{"letter":"C","text":"Quan trọng","correct":false},{"letter":"D","text":"Trọng yếu","correct":false}]},{"n":55,"text":"Ai là người đầu tiên đưa chủ nghĩa xã hội từ khoa học thành thực tiễn sinh động:","options":[{"letter":"A","text":"C. Mác","correct":false},{"letter":"B","text":"Hồ Chí Minh","correct":false},{"letter":"C","text":"Ph. Ăngghen","correct":false},{"letter":"D","text":"V. I. Lênin","correct":true}]},{"n":56,"text":"Nhà nước xã hội chủ nghĩa đầu tiên được thành lập ở đầu:","options":[{"letter":"A","text":"Ba Lan","correct":false},{"letter":"B","text":"Hungari","correct":false},{"letter":"C","text":"Nga","correct":true},{"letter":"D","text":"Việt Nam","correct":false}]},{"n":57,"text":"Trong các nội dung của quyền dân tộc tự quyết thì nội dung nào được coi là cơ bản nhất, tiên quyết nhất:","options":[{"letter":"A","text":"Tự quyết về chính trị","correct":true},{"letter":"B","text":"Tự quyết về kinh tế","correct":false},{"letter":"C","text":"Tự quyết về lãnh thổ","correct":false},{"letter":"D","text":"Tự quyết về văn hoá.","correct":false}]},{"n":58,"text":"So với các nền dân chủ trước đây, dân chủ xã hội chủ nghĩa có điểm khác biệt cơ bản nào:","options":[{"letter":"A","text":"Không còn mang tính giai cấp","correct":false},{"letter":"B","text":"Là nền dân chủ phi lịch sử","correct":false},{"letter":"C","text":"Là nền dân chủ rộng rãi cho giai cấp công nhân và nhân dân lao động","correct":true},{"letter":"D","text":"Là nền dân chủ thuần tuý","correct":false}]},{"n":59,"text":"Khái niệm nào được dùng để chỉ một cộng đồng người ổn định, được hình thành trong lịch sử, trong một lãnh thổ nhất định, có chung mối liên hệ về kinh tế, ngôn ngữ và văn hóa:","options":[{"letter":"A","text":"Dân tộc","correct":true},{"letter":"B","text":"Giai cấp","correct":false},{"letter":"C","text":"Tất cả các đáp án đều đúng","correct":false},{"letter":"D","text":"Tôn giáo","correct":false}]},{"n":60,"text":"Nhà nước Cộng hòa dân chủ nhân dân đầu tiên ở Châu Á:","options":[{"letter":"A","text":"Lần","correct":false},{"letter":"B","text":"Triều Tiên","correct":false},{"letter":"C","text":"Trung Quốc","correct":false},{"letter":"D","text":"Việt Nam","correct":true}]},{"n":61,"text":"C. Mác và Ph. Ăngghen đã dựa vào những phát kiến nào để xây dựng học thuyết về sử mệnh lịch sử của giai cấp công nhân?","options":[{"letter":"A","text":"Chủ nghĩa duy vật lịch sử","correct":false},{"letter":"B","text":"Chủ nghĩa duy vật lịch sử và Học thuyết giá trị thặng dư","correct":true},{"letter":"C","text":"Học thuyết giá trị thặng dư","correct":false},{"letter":"D","text":"Thuyết tiến hóa","correct":false}]},{"n":62,"text":"Sứ mệnh lịch sử của giai cấp công nhân do các yếu tố khách quan nào quy định?","options":[{"letter":"A","text":"Do bị áp bức bóc lột nặng nề","correct":false},{"letter":"B","text":"Do địa vị kinh tế - xã hội và đặc điểm chính trị - xã hội của giai cấp công nhân quy định","correct":true},{"letter":"C","text":"Do giai cấp công nhân là con đẻ của nền đại công nghiệp","correct":false},{"letter":"D","text":"Do sự phát triển của lực lượng sản xuất hiện đại","correct":false}]},{"n":63,"text":"“Yếu tố quyết định để giai cấp công nhân tập hợp, đoàn kết được các giai cấp, tầng lớp khác trong cách mạng xã hội chủ nghĩa","options":[{"letter":"A","text":"Do có cùng một kẻ thù chung là giai cấp tư sản","correct":false},{"letter":"B","text":"Do có những lợi ích cơ bản phù hợp và thống nhất với nhau","correct":true},{"letter":"C","text":"Do giai cấp công nhân mong muốn","correct":false},{"letter":"D","text":"Do mục tiêu về chính trị của giai cấp công nhân.","correct":false}]},{"n":64,"text":"Giai cấp công nhân là giai cấp tiên tiến nhất, bởi vì:","options":[{"letter":"A","text":"Bị áp bức bóc lột nặng nề nhất","correct":false},{"letter":"B","text":"Là giai cấp đông đảo nhất trong xã hội","correct":false},{"letter":"C","text":"Là giai cấp nghèo khổ nhất trong xã hội tư bản","correct":false},{"letter":"D","text":"Là sản phẩm của nền đại công nghiệp, đại diện cho lực lượng sản xuất tiên tiến của thời đại.","correct":true}]},{"n":65,"text":"Giai cấp công nhân là giai cấp triệt để cách mạng, bởi vì:","options":[{"letter":"A","text":"Bị áp bức bóc lột nặng nề, có lợi ích cơ bản đối kháng trực tiếp với giai cấp tư sản","correct":true},{"letter":"B","text":"Là giai cấp đông đảo nhất trong xã hội.","correct":false},{"letter":"C","text":"Là giai cấp không có tài sản, đời sống bấp bênh","correct":false},{"letter":"D","text":"Là giai cấp nghèo nhất trong xã hội tư bản","correct":false}]},{"n":66,"text":"Điền từ còn thiếu vào chỗ trống: \"Đảng cộng sản là [...] chiến đấu, là bộ tham mưu của giai cấp công nhân, là biểu hiện tập trung lợi ích, nguyện vọng, phẩm chất, trí tuệ của giai cấp công nhân và của dân tộc”.","options":[{"letter":"A","text":"Cơ quan chỉ huy","correct":false},{"letter":"B","text":"Cơ sở","correct":false},{"letter":"C","text":"Đội tiên phong","correct":true},{"letter":"D","text":"Lực lượng","correct":false}]},{"n":67,"text":"Điền từ còn thiếu vào chỗ trống: Giai cấp công nhân là cơ sở [....] của Đảng Cộng sản, là nguồn bổ sung lực lượng của Đảng Cộng sản.","options":[{"letter":"A","text":"Chính trị","correct":false},{"letter":"B","text":"Chính trị - xã hội","correct":false},{"letter":"C","text":"Giai cấp","correct":false},{"letter":"D","text":"Xã hội - giai cấp","correct":true}]},{"n":68,"text":"Hội nghị lần thứ 6, Ban Chấp hành Trung ương Đảng khóa X về xây dựng giai cấp công nhân thời kỳ:","options":[{"letter":"A","text":"Đẩy mạnh công nghiệp hóa, hiện đại hóa","correct":true},{"letter":"B","text":"Đẩy mạnh hội nhập kinh tế thế giới","correct":false},{"letter":"C","text":"Đẩy mạnh phát triển khoa học công nghệ","correct":false},{"letter":"D","text":"Toàn cầu hoá","correct":false}]},{"n":69,"text":"Đâu là Nghị quyết chuyên đề của Đảng Cộng sản Việt Nam về xây dựng giai cấp công nhân Việt Nam:","options":[{"letter":"A","text":"Nghị quyết TW6 khóa X","correct":true},{"letter":"B","text":"Nghị quyết TW6 khóa XI","correct":false},{"letter":"C","text":"Nghị quyết TW6 khóa XII","correct":false},{"letter":"D","text":"Nghị quyết TW6 khóa XIII","correct":false}]},{"n":70,"text":"Điều kiện chủ quan có vai trò quyết định nhất đến thực hiện sứ mệnh lịch sử của giai cấp công nhân:","options":[{"letter":"A","text":"Liên minh với giai cấp nông dân","correct":false},{"letter":"B","text":"Tăng nhanh về số lượng","correct":false},{"letter":"C","text":"Tất cả các đáp án","correct":false},{"letter":"D","text":"Thành lập được chính đảng","correct":true}]},{"n":71,"text":"Giai cấp công nhân có những đặc điểm chính trị - xã hội:","options":[{"letter":"A","text":"Tính tiên tiến, tính cách mạng triệt để, tính kỷ luật","correct":false},{"letter":"B","text":"Tính tiên tiến, tính cách mạng triệt để, tinh thần đoàn kết quốc tế","correct":false},{"letter":"C","text":"Tính tiên tiến, tính kỷ luật, tính cách mạng triệt để, tinh thần đoàn kết quốc tế","correct":true},{"letter":"D","text":"Tính tiên tiến, tính kỷ luật, tinh thần đoàn kết quốc tế","correct":false}]},{"n":72,"text":"Cuộc đấu tranh giữa chủ nghĩa tư bản với chủ nghĩa xã hội diễn ra trên các lĩnh vực:","options":[{"letter":"A","text":"Kinh tế, chính trị, tư tưởng","correct":false},{"letter":"B","text":"Kinh tế, chính trị, văn hoá","correct":false},{"letter":"C","text":"Kinh tế, chính trị, văn hoá, xã hội.","correct":true},{"letter":"D","text":"Kinh tế, chính trị, xã hội","correct":false}]},{"n":73,"text":"Mâu thuẫn cơ bản, xuyên suốt và chi phối đến sự vận động của thời đại trong giai đoạn hiện nay","options":[{"letter":"A","text":"Mâu thuẫn giữa các nước độc lập đang phát triển và phụ thuộc với chủ nghĩa đế quốc","correct":false},{"letter":"B","text":"Mâu thuẫn giữa các nước tư bản chủ nghĩa, các tập đoàn tư bản, các trung tâm kinh tế tư bản chủ nghĩa","correct":false},{"letter":"C","text":"Mâu thuẫn giữa chủ nghĩa xã hội và chủ nghĩa tư bản","correct":true},{"letter":"D","text":"Mâu thuẫn giữa tư bản và lao động","correct":false}]},{"n":74,"text":"Mâu thuẫn cơ bản, phản ánh bản chất bóc lột lao động làm thuê của giai cấp tư sản trong thời đại hiện nay:","options":[{"letter":"A","text":"Mâu thuẫn giữa các nước độc lập đang phát triển và phụ thuộc với chủ nghĩa đế quốc","correct":false},{"letter":"B","text":"Mâu thuẫn giữa các nước tư bản chủ nghĩa, các tập đoàn tư bản, các trung tâm kinh tế tư bản chủ nghĩa","correct":false},{"letter":"C","text":"Mâu thuẫn giữa chủ nghĩa xã hội và chủ nghĩa tư bản","correct":false},{"letter":"D","text":"Mâu thuẫn giữa tư bản và lao động.","correct":true}]},{"n":75,"text":"Đặc điểm nổi bật nhất của thời đại hiện nay:","options":[{"letter":"A","text":"Các nước với chế độ XH và trình độ phát triển khác nhau cùng tồn tại, vừa hợp tác vừa đấu tranh, cạnh tranh gay gắt vì lợi ích quốc gia, dân tộc","correct":true},{"letter":"B","text":"Cách mạng khoa học và công nghệ, kinh tế tri thức và quá trình toàn cầu hoá diễn ra mạnh mẽ, tác động sâu sắc đến mọi lĩnh vực đời sống xã hội, tạo ra cả cơ hội và thách thức","correct":false},{"letter":"C","text":"Chủ nghĩa xã hội tạm thời lâm vào thoái trào nhưng đang có sự phục hồi và định hình chủ nghĩa xã hội hiện thức mới","correct":false},{"letter":"D","text":"Đấu tranh giai cấp và đấu tranh dân tộc tiếp tục diễn ra gay gắt, phức tạp","correct":false}]},{"n":76,"text":"Đâu là nguyên nhân sâu xa của toàn cầu hóa nhất là toàn cầu hóa về kinh tế hiện nay.","options":[{"letter":"A","text":"Sự phát triển của lực lượng sản xuất","correct":true},{"letter":"B","text":"Tất cả các đáp án","correct":false},{"letter":"C","text":"Thay đổi kiến trúc thượng tầng","correct":false},{"letter":"D","text":"Thay đổi quan hệ sản xuất","correct":false}]},{"n":77,"text":"Quan điểm: “Thế giới đang trải qua những biến động to lớn, diễn biến rất nhanh chóng, phức tạp, khó dự báo. Hòa bình, hợp tác và phát triển vẫn là xu thế lớn... Toàn cầu hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang bị thách thức bởi sự cạnh tranh ảnh hưởng giữa các nước lớn và sự trỗi dậy của chủ nghĩa dân tộc cực đoan\" được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":78,"text":"Trong thời đại hiện nay các thế lực thù địch chống phá Quân đội nhân dân Việt Nam nhằm mục đích:","options":[{"letter":"A","text":"Dân sự hóa quốc phòng","correct":false},{"letter":"B","text":"Phi chính trị hóa quân đội","correct":true},{"letter":"C","text":"Tất cả các đáp án","correct":false},{"letter":"D","text":"Xây dựng quân đội nhà nghề","correct":false}]},{"n":79,"text":"Việt Nam quá độ lên chủ nghĩa xã hội với xuất phát điểm:","options":[{"letter":"A","text":"Từ nước là thuộc địa, nửa phong kiến, lực lượng sản xuất rất thấp","correct":true},{"letter":"B","text":"Từ nước nông nghiệp lạc hậu","correct":false},{"letter":"C","text":"Từ nước phong kiến, sản xuất nông nghiệp là chủ yếu","correct":false},{"letter":"D","text":"Từ nước tiền tư bản, công nghiệp phát triển","correct":false}]},{"n":80,"text":"Theo quan điểm của chủ nghĩa Mác - Lênin, mục tiêu cao nhất của chủ nghĩa xã hội là:","options":[{"letter":"A","text":"Có nền kinh tế phát triển cao dựa trên LLSX hiện đại và CĐCH về TLSX chủ yếu","correct":false},{"letter":"B","text":"Có nhà nước kiểu mới mang bản chất của GCCN, đại biểu cho lợi ích, quyền lực và ý chí của nhân dân lao động","correct":false},{"letter":"C","text":"Đảm bảo bình đẳng, đoàn kết giữa các dân tộc và có quan hệ hữu nghị, hợp tác với nhân dân các nước trên thế giới","correct":false},{"letter":"D","text":"Giải phóng giai cấp, giải phóng xã hội, giải phóng con người, tạo điều kiện để con người phát triển toàn diện","correct":true}]},{"n":81,"text":"Hình thức quá độ lên chủ nghĩa xã hội ở Việt Nam là:","options":[{"letter":"A","text":"Quá độ chuyển tiếp","correct":false},{"letter":"B","text":"Quá độ gián tiếp","correct":true},{"letter":"C","text":"Quá độ trực tiếp","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":82,"text":"Đặc điểm nổi bật của thời kỳ quá độ lên chủ nghĩa xã hội (chọn phương án đúng nhất):","options":[{"letter":"A","text":"Là thời kỳ cải biến cách mạng sâu sắc, toàn diện, triệt để","correct":false},{"letter":"B","text":"Là thời kỳ đấu tranh giai cấp diễn ra trong điều kiện mới, hình thức mới, phương pháp mới","correct":false},{"letter":"C","text":"Là thời kỳ quyết định sự thành công của chủ nghĩa xã hội.","correct":false},{"letter":"D","text":"Là thời kỳ tồn tại đan xen, đấu tranh giữa các yếu tố của xã hội cũ và những yếu tố của xã hội mới, xu hướng cái mới sẽ giành thắng lợi","correct":true}]},{"n":83,"text":"Đặc trưng của xã hội xã hội chủ nghĩa ở Việt Nam được nêu trong Cương lĩnh 1991 gồm:","options":[{"letter":"A","text":"6 đặc trưng","correct":true},{"letter":"B","text":"7 đặc trưng","correct":false},{"letter":"C","text":"8 đặc trưng","correct":false},{"letter":"D","text":"9 đặc trưng","correct":false}]},{"n":84,"text":"Đặc trưng của xã hội xã hội chủ nghĩa ở Việt Nam được nêu trong Cương lĩnh (bổ sung, phát triển 2011) gồm:","options":[{"letter":"A","text":"6 đặc trưng","correct":false},{"letter":"B","text":"7 đặc trưng","correct":false},{"letter":"C","text":"8 đặc trưng","correct":true},{"letter":"D","text":"9 đặc trưng","correct":false}]},{"n":85,"text":"Mục tiêu cụ thể phát triển đất nước tới năm 2025 được Đại hội XIII xác định:","options":[{"letter":"A","text":"Năm 2025 là nước đang phát triển, có công nghiệp theo hướng hiện đại, vượt qua mức thu nhập trung bình thấp.","correct":true},{"letter":"B","text":"Năm 2025 là nước đang phát triển, có công nghiệp theo hướng hiện đại hóa, vượt qua mức thu nhập trung bình thấp.","correct":false},{"letter":"C","text":"Năm 2025 là nước đang phát triển, có công nghiệp theo hướng tự do hóa, vượt qua mức thu nhập trung bình thấp.","correct":false},{"letter":"D","text":"Năm 2025 là nước đang phát triển, có công nghiệp theo hướng xã hội hóa, vượt qua mức thu nhập trung bình thấp.","correct":false}]},{"n":86,"text":"Mục tiêu: “Phấn đấu đến giữa thế kỷ XXI, nước ta trở thành nước phát triển, theo định hướng xã hội chủ nghĩa\" được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội VI","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":87,"text":"Nhân dân có quyền tham gia quản lý, thảo luận các vấn đề chung của nhà nước và xã hội là dân chủ trên lĩnh vực:","options":[{"letter":"A","text":"Chính trị","correct":true},{"letter":"B","text":"Kinh tế","correct":false},{"letter":"C","text":"Văn hoá","correct":false},{"letter":"D","text":"Xã hội","correct":false}]},{"n":88,"text":"Cơ sở kinh tế của nền dân chủ xã hội chủ nghĩa dựa trên:","options":[{"letter":"A","text":"Chế độ công hữu về tư liệu sản xuất chủ yếu","correct":true},{"letter":"B","text":"Chế độ tư hữu về tư liệu sản xuất chủ yếu","correct":false},{"letter":"C","text":"Sở hữu toàn dân","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":89,"text":"Điền từ thích hợp vào chỗ trống: “Nước ta là nước dân chủ, nghĩa là nước nhà do nhân dân làm chủ. Nhân dân có quyền lợi làm chủ, thì phải có [...] làm tròn bổn phận công dân\"","options":[{"letter":"A","text":"Khả năng","correct":false},{"letter":"B","text":"Nghĩa vụ","correct":true},{"letter":"C","text":"Trách nhiệm","correct":false},{"letter":"D","text":"Trình độ","correct":false}]},{"n":90,"text":"Phương châm: “Dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng\" được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"A","text":"Đại hội XII","correct":false},{"letter":"B","text":"Đại hội XIII","correct":true}]},{"n":91,"text":"Quan điểm: “Xử lý kịp thời, nghiêm minh những tổ chức, cá nhân lợi dụng dân chủ, gây rối nội bộ, làm mất ổn định chính trị - xã hội hoặc vi phạm dẫn chủ, làm phương hại đến quyền làm chủ của nhân dân” được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":92,"text":"Quan điểm: “Thực hiện đúng đắn, hiệu quả dân chủ trực tiếp, dân chủ đại diện, đặc biệt là dân chủ ở cơ sở\" được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":93,"text":"Cấu trúc hệ thống chính trị gồm:","options":[{"letter":"A","text":"Các đảng chính trị, Nhà nước, các tổ chức chính trị - xã hội (hợp pháp)","correct":true},{"letter":"B","text":"Các đảng chính trị, Nhà nước, các tổ chức quần chúng (hợp pháp)","correct":false},{"letter":"C","text":"Các đảng chính trị. Nhà nước, các tổ chức tập thể (hợp pháp)","correct":false},{"letter":"D","text":"Các đảng chính trị, Nhà nước, các tổ chức xã hội (hợp pháp)","correct":false}]},{"n":94,"text":"Hệ thống chính trị xã hội chủ nghĩa ở Việt Nam có cấu trúc, chọn phương án đúng nhất:","options":[{"letter":"A","text":"Đảng Cộng sản Việt Nam, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc và các tổ chức chính trị - xã hội hợp pháp","correct":true},{"letter":"B","text":"Đảng Cộng sản Việt Nam, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, các tổ chức xã hội hợp pháp","correct":false},{"letter":"C","text":"Đảng Cộng sản Việt Nam, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, các tổ chức kinh tế hợp pháp","correct":false},{"letter":"D","text":"Đảng Cộng sản Việt Nam, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, các tổ chức nghề nghiệp hợp pháp","correct":false}]},{"n":95,"text":"Nhà nước xã hội chủ nghĩa mang bản chất:","options":[{"letter":"A","text":"Giai cấp công nhân và giai cấp nông dân","correct":false},{"letter":"B","text":"Giai cấp công nhân và nhân dân lao động","correct":false},{"letter":"C","text":"Giai cấp công nhân và tính dân tộc sâu sắc","correct":false},{"letter":"D","text":"Giai cấp công nhân, tính nhân dân rộng rãi và tính dân tộc sâu sắc","correct":true}]},{"n":96,"text":"Đảng Cộng sản Việt Nam khẳng định: “Khơi dậy khát vọng phát triển đất nước, phát huy ý chí, sức mạnh đại đoàn kết toàn dẫn tộc kết hợp với sức mạnh của thời đại\" được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":97,"text":"Đảng Cộng sản Việt Nam khẳng định: “Xây dựng giai cấp công nhân hiện đại, lớn mạnh; nâng cao bản lĩnh chính trị, trình độ học vấn, chuyên môn, kỹ năng nghề nghiệp, tác phong công nghiệp, kỷ luật lao động thích ứng với cuộc Cách mạng công nghiệp lần thứ tư\" được nếu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":98,"text":"Âm mưu của chủ nghĩa đế quốc và các thế lực thù địch lợi dụng vấn đề dân tộc chống phá cách mạng nước ta ở vùng Tây Nguyên là:","options":[{"letter":"A","text":"Khôi phục nhà nước Chăm Pa","correct":false},{"letter":"B","text":"Khôi phục và thành lập đất nước của người Khơme Crôm","correct":false},{"letter":"C","text":"Thành lập cái gọi là nhà nước Đề Ga tự trị","correct":true},{"letter":"D","text":"Thành lập nhà nước Mông tự trị","correct":false}]},{"n":99,"text":"Tác phẩm: “Về quyền dân tộc tự quyết\" của","options":[{"letter":"A","text":"C. Mác","correct":false},{"letter":"B","text":"Ph. Ăngghen","correct":false},{"letter":"C","text":"Stalin","correct":false},{"letter":"D","text":"V. I. Lênin","correct":true}]},{"n":100,"text":"Đảng Cộng sản Việt Nam khẳng định: “Bảo đảm các dân tộc bình đẳng, đoàn kết, tổn trọng, giúp nhau cùng phát triển” được nêu trong văn kiện Đại hội:","options":[{"letter":"A","text":"Đại hội X","correct":false},{"letter":"B","text":"Đại hội XI","correct":false},{"letter":"C","text":"Đại hội XII","correct":false},{"letter":"D","text":"Đại hội XIII","correct":true}]},{"n":101,"text":"Để thực hiện âm mưu chống phá cách mạng Việt Nam, chủ nghĩa đế quốc và các thế lực thù địch lợi dụng vấn đề dân tộc, tôn giáo như:","options":[{"letter":"A","text":"Đường dẫn","correct":false},{"letter":"B","text":"Hậu thuẫn","correct":false},{"letter":"C","text":"Ngòi nổ","correct":true},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":102,"text":"Nguồn gốc cơ bản giữ vai trò quyết định sự ra đời của tôn giáo là:","options":[{"letter":"A","text":"Nguồn gốc kinh tế - xã hội","correct":true},{"letter":"B","text":"Nguồn gốc nhận thức","correct":false},{"letter":"C","text":"Nguồn gốc tâm lý","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":false}]},{"n":103,"text":"Bản chất của tôn giáo:","options":[{"letter":"A","text":"Là sự phản ánh đời sống xã hội","correct":false},{"letter":"B","text":"Là sự phản ánh hiện thực khách quan và tồn tại xã hội","correct":false},{"letter":"C","text":"Là sự phản ánh thế giới quan của con người đối với xã hội","correct":false},{"letter":"D","text":"Phản ánh xuyên tạc hiện thực khách quan biến lực lượng tự nhiên, xã hội thành lực lượng siêu nhiên trong giải quyết mối quan hệ giữa con người với tự nhiên, xã hội","correct":true}]},{"n":104,"text":"Điền từ thích hợp vào chỗ trống để hoàn thiện quan điểm của Đảng: “Tín ngưỡng, tôn giáo là nhu cầu ... của một bộ phận nhân dân, đang và sẽ tồn tại cùng dân tộc trong quá trình xây dựng chủ nghĩa xã hội ở nước ta”","options":[{"letter":"A","text":"Cấp bách","correct":false},{"letter":"B","text":"Không thể thiếu","correct":false},{"letter":"C","text":"Tinh thần","correct":true},{"letter":"D","text":"Vật chất","correct":false}]},{"n":105,"text":"Đặc trưng nổi bật trong quan hệ giữa các dân tộc ở Việt Nam:","options":[{"letter":"A","text":"Là các dân tộc có bản sắc văn hoá riêng, đa dạng, phong phú","correct":false},{"letter":"B","text":"Là có sự chênh lệch về trình độ phát triển kinh tế - xã hội giữa các dân tộc","correct":false},{"letter":"C","text":"Là sự cố kết dân tộc, hoà hợp dân tộc trong một cộng đồng thống nhất","correct":true},{"letter":"D","text":"Là sự phân bố đan xen nhau, không một dân tộc nào có lãnh thổ riêng","correct":false}]},{"n":106,"text":"Điền từ thích hợp vào chỗ trống để hoàn thiện khái niệm: Tôn giáo là một hình thái ý thức - xã hội phản ánh một cách hoang đường, hư ảo [...] khách quan. Qua sự phản ánh của tôn giáo, những sức mạnh tự phát trong tự nhiên và xã hội đều trở thành thần bí.","options":[{"letter":"A","text":"Điều kiện","correct":false},{"letter":"B","text":"Đời sống","correct":false},{"letter":"C","text":"Hiện thực","correct":true},{"letter":"D","text":"Thực tiễn","correct":false}]},{"n":107,"text":"Giữa chủ nghĩa Mác – Lênin và hệ tư tưởng tôn giáo có điểm khác biệt nào?","options":[{"letter":"A","text":"Con đường đấu tranh giai cấp","correct":false},{"letter":"B","text":"Con đường đến cõi niết bản","correct":false},{"letter":"C","text":"Con đường đến thiên đàng","correct":false},{"letter":"D","text":"Con đường mưu cầu hạnh phúc cho nhân dân","correct":true}]},{"n":108,"text":"Đâu là lý do khẳng định tất yếu phải đấu tranh bảo vệ và phát triển chủ nghĩa xã hội khoa học hiện nay:","options":[{"letter":"A","text":"Từ chức năng, nhiệm vụ của chủ nghĩa xã hội khoa học","correct":false},{"letter":"B","text":"Từ nhiệm vụ, phương pháp nghiên cứu của chủ nghĩa xã hội khoa học","correct":false},{"letter":"C","text":"Từ vị trí, chức năng, nhiệm vụ của chủ nghĩa xã hội khoa học","correct":true},{"letter":"D","text":"Từ vị trí, vai trò của chủ nghĩa xã hội khoa học","correct":false}]},{"n":109,"text":"Đâu là lý do khẳng định tất yếu phải đấu tranh bảo vệ và phát triển chủ nghĩa xã hội khoa học hiện nay:","options":[{"letter":"A","text":"Từ âm mưu, thủ đoạn của các thế lực thù địch","correct":false},{"letter":"B","text":"Từ bản chất, âm mưu của các thế lực thù địch","correct":false},{"letter":"C","text":"Từ bản chất, âm mưu, thủ đoạn của các thế lực thù địch","correct":true},{"letter":"D","text":"Từ bản chất, thủ đoạn của các thế lực thù địch","correct":false}]},{"n":110,"text":"Đâu là lý do khẳng định tất yếu phải đấu tranh bảo vệ và phát triển chủ nghĩa xã hội khoa học hiện nay:","options":[{"letter":"A","text":"Từ tính chất hoàn chỉnh của học thuyết chủ nghĩa xã hội khoa học","correct":false},{"letter":"B","text":"Từ tính chất mở của học thuyết chủ nghĩa xã hội khoa học","correct":true},{"letter":"C","text":"Từ tính chất toàn diện của học thuyết chủ nghĩa xã hội khoa học","correct":false},{"letter":"D","text":"Từ tính chất triệt để của học thuyết chủ nghĩa xã hội khoa học","correct":false}]},{"n":111,"text":"Đâu là lý do khẳng định tất yếu phải đấu tranh bảo vệ và phát triển chủ nghĩa xã hội khoa học hiện nay:","options":[{"letter":"A","text":"Từ sự sụp đổ của chủ nghĩa xã hội hiện thực ở Liên Xô và Đông Âu","correct":false},{"letter":"B","text":"Từ thực tiễn phong trào cách mạng xã hội chủ nghĩa thế giới","correct":false},{"letter":"C","text":"Từ thực tiễn phong trào cách mạng xã hội chủ nghĩa, thực tiễn xây dựng chủ nghĩa xã hội trên thế giới và Việt Nam hiện nay","correct":true},{"letter":"D","text":"Từ thực tiễn xây dựng chủ nghĩa xã hội trên thế giới và Việt Nam hiện nay","correct":false}]},{"n":112,"text":"Đâu là nguyên tắc hàng đầu trong đấu tranh "D","text":"Đại hội XIII","correct":false}]},{"n":117,"text":"Trách nhiệm của Quân đội nhân dân Việt Nam trong thực hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay:","options":[{"letter":"A","text":"Chiến đấu bảo vệ chế độ xã hội chủ nghĩa","correct":false},{"letter":"B","text":"Chiến đấu bảo vệ độc lập chủ quyền, toàn vẹn lãnh thổ Tổ quốc, bảo vệ sự lãnh đạo của Đảng","correct":false},{"letter":"C","text":"Chiến đấu bảo vệ thành quả cách mạng của giai cấp công nhân và nhân dân ta đã giành được","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":true}]},{"n":118,"text":"Tăng cường bản chất giai cấp công nhân cho Quân đội nhân dân Việt Nam hiện nay.","options":[{"letter":"A","text":"Quán triệt đường lối, quan điểm của Đảng Cộng sản Việt Nam","correct":false},{"letter":"B","text":"Tăng cường giáo dục chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh","correct":false},{"letter":"C","text":"Tất cả các đáp án","correct":true},{"letter":"D","text":"Xây dựng Quân đội nhân dân Việt Nam cách mạng, chính quy tinh nhuệ, từng buớc hiện đại.","correct":false}]},{"n":119,"text":"Tác động của thời đại hiện nay đến Quân đội nhân dân Việt Nam:","options":[{"letter":"A","text":"Nâng cao sức mạnh chiến đấu, thực hiện tốt đối ngoại quốc phòng góp phần xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới","correct":false},{"letter":"B","text":"Nâng cao tinh thần cảnh giác cách mạng, khả năng sẵn sàng chiến đấu, giữ vững môi trường hòa bình, ổn định và phát triển của đất nước","correct":false},{"letter":"C","text":"Nêu cao tinh thần cảnh giác cách mạng, đánh bại chiến lược “Diễn biến hòa bình\" kết hợp với bạo loạn lật đổ của chủ nghĩa đế quốc và các thế lực thù địch","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":true}]},{"n":120,"text":"Vai trò Quân đội nhân dân Việt Nam trong giữ vững định hướng xã hội chủ nghĩa ở Việt Nam hiện nay:","options":[{"letter":"A","text":"Là lực lượng cùng toàn Đảng, toàn dân đấu tranh trên các mặt trận kinh tế, chính trị, tư tưởng, văn hóa để bảo vệ đất nước theo định hướng xã hội chủ nghĩa","correct":false},{"letter":"B","text":"Là lực lượng nòng cốt trong bảo vệ Tổ quốc, giữ vững môi trường hòa bình, ổn định cho phát triển đất nước theo định hướng xã hội chủ nghĩa","correct":false},{"letter":"C","text":"Là lực lượng tích cực tham gia xây dựng kinh tế, vừa tạo điều kiện cho tăng cường hội nhập quốc tế, vẫn tăng cường khả năng bảo vệ lãnh thổ của Tổ quốc","correct":false},{"letter":"D","text":"Tất cả các đáp án","correct":true}]}]}};
const EXAM_COUNT=40, EXAM_MINUTES=30;
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyWrong=id=>'wrong_'+id, keyHist=id=>'hist_'+id;
let state={subject:null,feature:'home',exam:null,studyIndex:0,wrongIndex:0,stats:null};
function getWrong(id){return JSON.parse(localStorage.getItem(keyWrong(id))||'[]')}
function setWrong(id,a){localStorage.setItem(keyWrong(id),JSON.stringify([...new Set(a)]))}
function getHist(id){return JSON.parse(localStorage.getItem(keyHist(id))||'[]')}
function saveHistory(id,item){let a=getHist(id);a.unshift(item);localStorage.setItem(keyHist(id),JSON.stringify(a.slice(0,100)))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bank(){return DATA[state.subject]}
function goHome(){state={subject:null,feature:'home',exam:null,studyIndex:0,wrongIndex:0};render()}
function goSubject(){if(state.subject){state.feature='menu';state.exam=null;render()}else goHome()}
function chooseSubject(id){state.subject=id;state.feature='menu';state.exam=null;render()}
function header(){return `<div class="top"><div class="brand">📚 ÔN THI 3 MÔN <span class="badge">V4</span></div>${state.subject?`<button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button>`:''}</div>`}
function render(){let a=$('#app');let body='';if(!state.subject) body=home(); else if(state.feature==='menu') body=subjectMenu(); else if(state.feature==='study') body=study(); else if(state.feature==='exam') body=exam(); else if(state.feature==='wrong') body=wrong(); else if(state.feature==='stats') body=stats(); a.innerHTML=`<div class="app">${header()}${body}<div class="footer">Dữ liệu câu hỏi được lấy từ bộ đề gốc • Thi thử: ${EXAM_COUNT} câu / ${EXAM_MINUTES} phút</div></div>`}
function home(){return `<div class="card hero"><h1>ÔN THI 3 MÔN</h1><p>Chọn môn để vào menu riêng của môn. Có thể học, thi thử, ôn câu sai và xem thống kê.</p></div><div class="grid">${Object.values(DATA).map(b=>`<div class="card subject"><div><h2>${esc(b.title)}</h2><p>${b.questions.length} câu trong ngân hàng</p></div><button class="btn" onclick="chooseSubject('${b.id}')">Vào môn →</button></div>`).join('')}</div>`}
function subjectMenu(){let b=bank();return `<div class="navrow"><button class="btn secondary" onclick="goHome()">← Đổi môn</button></div><div class="card"><div class="title"><div><h2>${esc(b.title)}</h2><div class="small">${b.questions.length} câu • Thi thử ${EXAM_COUNT} câu / ${EXAM_MINUTES} phút</div></div></div></div><div class="subject-menu"><button class="feature" onclick="state.feature='study';state.studyIndex=0;render()"><b>📖 Ôn tập</b><span>Học từng câu, chọn đáp án và xem đúng/sai ngay.</span></button><button class="feature" onclick="startExam()"><b>📝 Thi thử</b><span>Ngẫu nhiên đúng ${EXAM_COUNT} câu, làm trong ${EXAM_MINUTES} phút.</span></button><button class="feature" onclick="state.feature='wrong';state.wrongIndex=0;render()"><b>❌ Ôn câu sai</b><span>Các câu đã trả lời sai được lưu trên thiết bị.</span></button><button class="feature" onclick="state.feature='stats';render()"><b>📊 Thống kê</b><span>Xem lịch sử thi và kết quả của môn này.</span></button></div>`}
function backFeature(){state.feature='menu';state.exam=null;render()}
function study(){let b=bank(),q=b.questions[state.studyIndex];return `<div class="navrow"><button class="btn secondary" onclick="backFeature()">← Quay lại môn</button><button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button></div><div class="card"><div class="title"><div><h2>📖 Ôn tập</h2><div class="small">Câu ${state.studyIndex+1}/${b.questions.length}</div></div></div><div class="progress"><i style="width:${(state.studyIndex+1)/b.questions.length*100}%"></i></div><div class="question">${esc(q.text)}</div><div id="studyOpts">${q.options.map((o,i)=>`<button class="option" id="so${i}" onclick="answerStudy(${i})"><span class="letter">${esc(o.letter)}.</span><span>${esc(o.text)}</span></button>`).join('')}</div><div id="studyResult"></div><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="prevStudy()">← Câu trước</button><button class="btn" onclick="nextStudy()">Câu tiếp →</button></div></div>`}
function answerStudy(i){let b=bank(),q=b.questions[state.studyIndex];document.querySelectorAll('#studyOpts .option').forEach((el,j)=>{el.disabled=true;if(q.options[j].correct)el.classList.add('correct');if(j===i&&!q.options[j].correct)el.classList.add('wrong')});let ok=q.options[i].correct; if(!ok){let w=getWrong(b.id);w.push(q.n);setWrong(b.id,w)}$('#studyResult').innerHTML=`<div class="result ${ok?'ok':'bad'}">${ok?'✅ Chính xác!':'❌ Chưa đúng. Đáp án đúng: '+esc(q.options.find(o=>o.correct).letter)}</div>`}
function prevStudy(){if(state.studyIndex>0){state.studyIndex--;render()}}
function nextStudy(){if(state.studyIndex<bank().questions.length-1){state.studyIndex++;render()}else{state.studyIndex=0;render()}}
function startExam(){let qs=shuffle(bank().questions).slice(0,Math.min(EXAM_COUNT,bank().questions.length));state.exam={qs,answers:Array(qs.length).fill(null),idx:0,end:Date.now()+EXAM_MINUTES*60000,submitted:false};state.feature='exam';render();tick()}
let timerHandle=null;
function tick(){clearTimeout(timerHandle);if(!state.exam||state.exam.submitted)return;let remain=Math.max(0,state.exam.end-Date.now());if(remain<=0){submitExam(true);return}let el=$('#timer');if(el){let s=Math.ceil(remain/1000),m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');el.textContent=`${String(m).padStart(2,'0')}:${ss}`}timerHandle=setTimeout(tick,250)}
function exam(){let e=state.exam;if(!e)return '';if(e.submitted)return examResult();let q=e.qs[e.idx];let answered=e.answers.filter(x=>x!==null).length;return `<div class="navrow"><button class="btn secondary" onclick="backFeature()">← Quay lại môn</button><button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button></div><div class="exambar"><div class="card" style="margin:0;padding:11px"><div class="title"><b>📝 Thi thử • Câu ${e.idx+1}/${e.qs.length}</b><span id="timer" class="timer">30:00</span></div><div class="progress"><i style="width:${answered/e.qs.length*100}%"></i></div></div></div><div class="card"><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${e.answers[e.idx]===i?'selected':''}" onclick="pickExam(${i})"><span class="letter">${esc(o.letter)}.</span><span>${esc(o.text)}</span></button>`).join('')}<div class="actions"><button class="btn secondary" onclick="examPrev()">← Câu trước</button><button class="btn" onclick="examNext()">${e.idx===e.qs.length-1?'Nộp bài':'Câu tiếp →'}</button></div></div><div class="card"><b>Danh sách câu</b><div class="palette">${e.qs.map((_,i)=>`<button class="pal ${e.answers[i]!==null?'answered':''} ${i===e.idx?'current':''}" onclick="jumpExam(${i})">${i+1}</button>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn danger" onclick="submitExam(false)">Nộp bài</button></div></div>`}
function pickExam(i){state.exam.answers[state.exam.idx]=i;render();tick()}
function jumpExam(i){state.exam.idx=i;render();tick()}
function examPrev(){if(state.exam.idx>0){state.exam.idx--;render();tick()}}
function examNext(){if(state.exam.idx<state.exam.qs.length-1){state.exam.idx++;render();tick()}else submitExam(false)}
function submitExam(auto){if(!state.exam||state.exam.submitted)return;clearTimeout(timerHandle);let e=state.exam,b=bank();let score=0,w=[];e.qs.forEach((q,i)=>{let a=e.answers[i];if(a!==null&&q.options[a].correct)score++;else if(a!==null)w.push(q.n)});setWrong(b.id,[...getWrong(b.id),...w]);saveHistory(b.id,{date:new Date().toLocaleString('vi-VN'),score,total:e.qs.length,percent:Math.round(score/e.qs.length*100),auto});e.submitted=true;render()}
function examResult(){let e=state.exam,b=bank(),score=e.qs.reduce((n,q,i)=>n+(e.answers[i]!==null&&q.options[e.answers[i]].correct?1:0),0);return `<div class="navrow"><button class="btn" onclick="backFeature()">← Về menu môn</button><button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button></div><div class="card hero"><h1>🏁 Kết quả thi thử</h1><p>${esc(b.title)}</p><div style="font-size:42px;font-weight:900;margin:12px 0">${score}/${e.qs.length}</div><p>${Math.round(score/e.qs.length*100)}% • ${e.answers.filter(x=>x!==null).length} câu đã trả lời</p><div class="actions" style="justify-content:center;margin-top:14px"><button class="btn" onclick="startExam()">🔁 Thi lại</button><button class="btn secondary" onclick="backFeature()">← Về menu môn</button></div></div>`}
function wrong(){let b=bank(),ids=getWrong(b.id),qs=ids.map(n=>b.questions.find(q=>q.n===n)).filter(Boolean);if(!qs.length)return `<div class="navrow"><button class="btn secondary" onclick="backFeature()">← Quay lại môn</button><button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button></div><div class="card empty">Chưa có câu sai được lưu trong môn này.</div>`;let q=qs[state.wrongIndex%qs.length];return `<div class="navrow"><button class="btn secondary" onclick="backFeature()">← Quay lại môn</button><button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button></div><div class="card"><div class="title"><div><h2>❌ Ôn câu sai</h2><div class="small">Câu ${state.wrongIndex+1}/${qs.length} • ID câu ${q.n}</div></div><button class="btn danger" onclick="setWrong('${b.id}',[]);render()">Xóa danh sách sai</button></div><div class="question">${esc(q.text)}</div>${q.options.map(o=>`<div class="option ${o.correct?'correct':''}"><span class="letter">${esc(o.letter)}.</span><span>${esc(o.text)}</span></div>`).join('')}<div class="actions"><button class="btn secondary" onclick="state.wrongIndex=Math.max(0,state.wrongIndex-1);render()">← Câu trước</button><button class="btn" onclick="state.wrongIndex=(state.wrongIndex+1)%qs.length;render()">Câu tiếp →</button></div></div>`}
function stats(){let b=bank(),h=getHist(b.id),wrong=getWrong(b.id),attempts=h.length,total=h.reduce((s,x)=>s+x.score,0),qtotal=h.reduce((s,x)=>s+x.total,0),avg=qtotal?Math.round(total/qtotal*100):0;return `<div class="navrow"><button class="btn secondary" onclick="backFeature()">← Quay lại môn</button><button class="btn secondary" onclick="goHome()">🔄 Đổi môn</button></div><div class="card"><h2>📊 Thống kê • ${esc(b.title)}</h2><div class="statsgrid"><div class="stat"><strong>${attempts}</strong><span class="muted">Lần thi</span></div><div class="stat"><strong>${avg}%</strong><span class="muted">Tỷ lệ đúng TB</span></div><div class="stat"><strong>${wrong.length}</strong><span class="muted">Câu sai đang lưu</span></div></div><div class="history">${h.length?h.slice(0,30).map(x=>`<div class="hist"><span>${esc(x.date)}${x.auto?' • Hết giờ':''}</span><b>${x.score}/${x.total} (${x.percent}%)</b></div>`).join(''):'<div class="empty">Chưa có lịch sử thi.</div>'}</div></div>`}
window.goHome=goHome;window.chooseSubject=chooseSubject;window.backFeature=backFeature;window.answerStudy=answerStudy;window.prevStudy=prevStudy;window.nextStudy=nextStudy;window.startExam=startExam;window.pickExam=pickExam;window.jumpExam=jumpExam;window.examPrev=examPrev;window.examNext=examNext;window.submitExam=submitExam;window.setWrong=setWrong;window.render=render;
render(); if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
